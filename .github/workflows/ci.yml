name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Supersede in-flight runs on the same ref instead of queueing them.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Matches the local interpreter (.venv is 3.14.6). Bump this when the
          # project moves, and consider a matrix once the torch install is
          # cheap enough to run twice.
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        # Installing torch is a large download; the pip cache above absorbs
        # the repeat cost on subsequent runs.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests with coverage
        # The fail_under floor in .coveragerc is enforced by this second
        # command, so a coverage regression fails the job.
        run: |
          coverage run -m pytest
          coverage report
          coverage xml

      - name: Dependency vulnerability audit
        run: |
          pip-audit --requirement requirements-dev.txt \
            --ignore-vuln PYSEC-2026-3721 \
            --ignore-vuln PYSEC-2025-217 \
            --ignore-vuln PYSEC-2026-2288 \
            --ignore-vuln PYSEC-2026-2289 \
            --ignore-vuln PYSEC-2026-2290 \
            --ignore-vuln PYSEC-2026-3929
        # The six ignores above are the known, currently-unfixable findings.
        # Every one is documented in markdowns/session.md; the point of
        # allowlisting them is that any NEW vulnerability still fails CI.
        # PYSEC-2026-3721 is pip itself (a build tool, not shipped).
        # The transformers PYSEC-* entries have no stable fixed release - the
        # upstream fixes only exist on 5.x release candidates, so bumping
        # sentence-transformers past them is not currently an option. Revisit
        # when transformers 5.x stabilises.

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            .coverage
            coverage.xml
          if-no-files-found: ignore
          retention-days: 7

  docker:
    name: Docker image build + smoke test
    runs-on: ubuntu-latest
    # The Dockerfile cannot be verified from a developer's machine reliably -
    # it needs a working daemon, and this repo's author has virtualization
    # disabled in firmware, so WSL2 and Docker Desktop cannot start there. This
    # job is the only thing that proves the image builds and that both roles
    # start, so it is a required check rather than a best-effort one.
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        # Heavy: requirements.txt pulls torch, so the first build is a
        # multi-gigabyte download. Layers are cached by the runner between
        # runs, but a cold build takes several minutes.
        run: docker build --tag support-api:${{ github.sha }} .

      - name: Image runs as a non-root user
        run: |
          user="$(docker inspect --format '{{.Config.User}}' support-api:${{ github.sha }})"
          echo "image user: ${user}"
          if [ -z "$user" ] || [ "$user" = "root" ] || [ "$user" = "0" ]; then
            echo "::error::image does not set a non-root USER"
            exit 1
          fi

      - name: Migrations apply to an empty database
        # Both commands in ONE container, on purpose. Two `docker run --rm`
        # invocations were the first version, but --rm discards the container's
        # filesystem, so the second command inspected a database that no longer
        # existed and could not fail. A named volume fixed the persistence and
        # then failed differently: Docker creates volumes owned by root, and
        # this image runs as uid 10001, so SQLite could not create its file.
        # /tmp is world-writable, which is the right place for a throwaway
        # check - and the real deploy target is PostgreSQL, not a SQLite file on
        # a volume, so the volume was modelling a situation that does not occur.
        run: |
          current="$(docker run --rm \
            -e DATABASE_URL=sqlite:////tmp/migrate.db \
            support-api:${{ github.sha }} \
            sh -c 'alembic upgrade head && alembic current' 2>&1)"
          echo "$current"
          # `alembic current` exits 0 and prints no revision at all when the
          # database has never been migrated, so the exit code proves nothing.
          # "(head)" is the part that separates an upgraded database from an
          # empty one, and it tracks new migrations instead of hardcoding a
          # revision id that would rot on the next one.
          if ! grep -q "(head)" <<<"$current"; then
            echo "::error::database is not at the alembic head"
            exit 1
          fi

      - name: API serves /health
        run: |
          docker run --detach --name support-api \
            --publish 8000:8000 \
            -e DATABASE_URL=sqlite:////tmp/api.db \
            -e APP_ENV=development \
            -e TRUSTED_HOSTS=localhost,127.0.0.1 \
            -e SUPPORT_TOOL_PROVIDER=mock \
            support-api:${{ github.sha }}
          # Poll the image's own HEALTHCHECK rather than curl, so the probe
          # command in the Dockerfile is exercised too.
          for i in $(seq 1 60); do
            status="$(docker inspect --format '{{.State.Health.Status}}' support-api)"
            if [ "$status" = "healthy" ]; then
              echo "container healthy after ${i}s"
              curl -sf http://127.0.0.1:8000/health
              exit 0
            fi
            if [ "$status" = "unhealthy" ]; then
              echo "::error::container became unhealthy"
              docker logs support-api
              exit 1
            fi
            sleep 1
          done
          echo "::error::container never became healthy"
          docker logs support-api
          exit 1

      - name: Container serves the ticket API
        # A booted process is not the same as a working API: this checks the
        # app wired its routers and can reach its database.
        run: |
          curl -sf http://127.0.0.1:8000/openapi.json \
            | python -c 'import json,sys; paths=json.load(sys.stdin)["paths"]; assert "/tickets" in paths, sorted(paths); print(f"{len(paths)} routes exposed")'
          status="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/tickets)"
          if [ "$status" != "401" ]; then
            echo "::error::unauthenticated /tickets returned ${status}, expected 401"
            exit 1
          fi

      - name: Worker boots and registers its task
        run: |
          # No broker is running, which is the point: the worker must still come
          # up and register support.notify, so a broken CELERY entrypoint or a
          # missing task fails here rather than in production.
          docker run --detach --name support-worker \
            -e DATABASE_URL=sqlite:////tmp/worker.db \
            -e CELERY_TASK_ALWAYS_EAGER=0 \
            -e REDIS_URL=redis://127.0.0.1:6379/0 \
            support-api:${{ github.sha }} \
            celery -A app.core.workers worker --loglevel=info --pool=solo
          for i in $(seq 1 30); do
            if docker logs support-worker 2>&1 | grep -q "support.notify"; then
              echo "worker registered support.notify after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::worker never registered support.notify"
          docker logs support-worker
          exit 1

      - name: Container logs
        if: failure()
        run: |
          docker logs support-api || true
          docker logs support-worker || true

      - name: Clean up containers
        if: always()
        run: docker rm --force support-api support-worker || true

  e2e:
    name: Frontend build + Playwright e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install frontend dependencies
        # npm ci, not npm install: package.json pins every dependency as
        # "latest", so the lockfile is the only thing making this
        # reproducible.
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start API
        # SQLite on a throwaway file so the run never touches support.db.
        # init_db() in the lifespan creates the schema, and Alembic is not
        # needed for e2e.
        env:
          DATABASE_URL: sqlite:///./.ci-e2e.db
          APP_ENV: development
          TRUSTED_HOSTS: localhost,127.0.0.1
          CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/api.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8000/health > /dev/null; then
              echo "API healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "API failed to become healthy in 60s"
          cat /tmp/api.log
          exit 1

      - name: Seed the e2e admin account
        # Registration only ever creates customers, so the staff e2e spec needs
        # an admin seeded straight into the throwaway database. Run after the
        # API is up so its lifespan has already created the schema.
        env:
          DATABASE_URL: sqlite:///./.ci-e2e.db
        run: python scripts/seed_e2e_admin.py

      - name: Run Playwright e2e
        # playwright.config.ts starts the vite dev server itself; only the
        # API needs to be running beforehand.
        working-directory: frontend
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  postgres:
    name: PostgreSQL + real Celery worker
    runs-on: ubuntu-latest

    # SQLite cannot show what is different about a real database, and an eager
    # task queue cannot show that a task runs at all. Everything below exists to
    # put the two real dependencies underneath the app and see what breaks.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: support
          POSTGRES_PASSWORD: support
          POSTGRES_DB: support_suite
        ports: ["5432:5432"]
        # The quotes are load-bearing. `options` is word-split, so an
        # unquoted `pg_isready -U support -d support_suite` reaches docker
        # create as three separate arguments and it fails with
        # "unknown shorthand flag: 'U' in -U" before the container exists.
        options: >-
          --health-cmd "pg_isready -U support -d support_suite"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20

    env:
      DATABASE_URL: postgresql+psycopg://support:support@127.0.0.1:5432/support_suite
      REDIS_URL: redis://127.0.0.1:6379/0
      # Only the connection strings belong here. APP_ENV, LLM_PROVIDER,
      # TRUSTED_HOSTS, JWT_SECRET and CHANNEL_WEBHOOK_SECRET all REPLACE an app
      # default that the tests depend on, rather than adding to it, and each one
      # broke the suite in a different way before being removed:
      #   - TRUSTED_HOSTS dropped `testserver` (the TestClient's Host header):
      #     124 tests became 400 "Invalid host header"
      #   - CHANNEL_WEBHOOK_SECRET replaced the "local-webhook-secret" the
      #     webhook tests authenticate with: they became 401
      #   - LLM_PROVIDER=mock provisioned the LLM gateway the tests expect to be
      #     absent: response-draft tests that expect 503 got 200
      # The suite must run with the same defaults as a developer machine.

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run the test suite against PostgreSQL
        # The same 295 tests, on the database that will actually be deployed
        # against. SQLite is permissive in ways that hide real bugs: it does not
        # enforce foreign keys, and it stores TIMESTAMP WITHOUT TIME ZONE, so a
        # timezone bug cannot survive to production.
        env:
          TEST_DATABASE_URL: postgresql+psycopg://support:support@127.0.0.1:5432/support_suite
        run: |
          python -m pytest -q

      - name: Create the deployment database
        # A second database, because the suite drops and recreates every table
        # between tests. The end-to-end run below has to use a database that
        # Alembic built, not one the test harness left behind.
        run: |
          python - <<'PY'
          import psycopg
          with psycopg.connect(
              "postgresql://support:support@127.0.0.1:5432/postgres", autocommit=True
          ) as connection:
              connection.execute("CREATE DATABASE support_deploy")
          PY

      - name: Apply migrations to PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg://support:support@127.0.0.1:5432/support_deploy
        run: |
          python -m alembic upgrade head
          # A Postgres DDL failure that SQLite would have swallowed is the
          # whole point of this step, so assert the schema rather than trusting
          # the exit code alone.
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, inspect
          engine = create_engine(os.environ["DATABASE_URL"])
          tables = set(inspect(engine).get_table_names()) - {"alembic_version"}
          required = {
              "users", "tickets", "ticket_comments", "audit_logs",
              "feedback", "revoked_tokens",
          }
          missing = required - tables
          if missing:
              raise SystemExit(f"migrations did not create: {sorted(missing)}")
          print(f"alembic created {len(tables)} tables: {sorted(tables)}")
          PY

      - name: Start the notification receiver
        run: |
          nohup python scripts/notify_receiver.py 8099 > /tmp/receiver.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8099/health > /dev/null; then
              echo "receiver up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/receiver.log
          exit 1

      - name: Start a real Celery worker
        # --loglevel=debug is required, not decorative: Celery only logs its
        # per-task "received" line at DEBUG, and the driver asserts on that line
        # to prove the task went through the broker instead of being run inline
        # by the API. --pool=solo matches the documented container command.
        env:
          CELERY_TASK_ALWAYS_EAGER: '0'
          NOTIFY_WEBHOOK_URL: http://127.0.0.1:8099/hook
        run: |
          nohup celery -A app.core.workers worker \
            --loglevel=debug --pool=solo > /tmp/worker.log 2>&1 &
          for i in $(seq 1 60); do
            if grep -q "celery@\|ready" /tmp/worker.log; then
              echo "worker up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/worker.log
          exit 1

      - name: Start the API against PostgreSQL with a real broker
        # This is the live process, so it is where app config belongs - unlike
        # the job level, where it replaced defaults the test suite depends on.
        env:
          # Non-eager, explicitly. This project defaults CELERY_TASK_ALWAYS_EAGER
          # to 1, which would run notifications inside the API process and make
          # the worker decorative.
          DATABASE_URL: postgresql+psycopg://support:support@127.0.0.1:5432/support_deploy
          CELERY_TASK_ALWAYS_EAGER: '0'
          APP_ENV: development
          TRUSTED_HOSTS: 127.0.0.1,localhost,testserver
          LLM_PROVIDER: mock
          SUPPORT_TOOL_PROVIDER: mock
          JWT_SECRET: ci-only-not-a-real-secret
          CHANNEL_WEBHOOK_SECRET: ci-only-not-a-real-secret
          NOTIFY_WEBHOOK_URL: http://127.0.0.1:8099/hook
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 \
            > /tmp/api.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8000/health > /dev/null; then
              echo "API up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/api.log
          exit 1

      - name: A real task runs end to end
        env:
          DATABASE_URL: postgresql+psycopg://support:support@127.0.0.1:5432/support_deploy
          CELERY_TASK_ALWAYS_EAGER: '0'
          NOTIFY_WEBHOOK_URL: http://127.0.0.1:8099/hook
        run: python scripts/e2e_postgres_worker.py --worker-log /tmp/worker.log

      - name: Dump logs
        if: failure()
        run: |
          echo "=== api ==="; tail -40 /tmp/api.log || true
          echo "=== worker ==="; tail -40 /tmp/worker.log || true
          echo "=== receiver ==="; cat /tmp/receiver.log || true

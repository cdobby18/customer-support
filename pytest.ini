[pytest]
testpaths = tests
# `-q` keeps CI logs readable; -ra surfaces the reason for every skip/xfail
# so a silently skipped test cannot hide a real failure.
addopts = -ra
# Starlette's TestClient warns that httpx is the deprecated integration. It is
# the supported path until httpx2 stabilises, so the warning is not actionable.
filterwarnings =
    ignore:Using `httpx` with `starlette.testclient` is deprecated:DeprecationWarning
    ignore:Using `httpx` with `starlette.testclient` is deprecated:UserWarning
